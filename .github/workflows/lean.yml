name: Lean formalization
on:
  push:
    paths:
      - 'lean/**'
      - 'scripts/verify_lean.py'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'scripts/verify_lean.py'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Lean distribution
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o lean.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum --check
          tar --use-compress-program=unzstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and required mathlib cache
        working-directory: lean
        shell: bash
        run: |
          mapfile -t lean_imports < <(python3 ../scripts/verify_lean.py --imports)
          lake exe cache get "${lean_imports[@]}"
      - name: Compile all proofs and audit every project declaration
        run: python3 scripts/verify_lean.py
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lean-build-evidence
          path: build/lean/
          if-no-files-found: ignore
